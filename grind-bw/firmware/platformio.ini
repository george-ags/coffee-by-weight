; PlatformIO project for GRIND-BW on the Waveshare ESP32-S3-Touch-AMOLED-1.64.
;
; Open this folder in VS Code + PlatformIO (or `pio run -t upload` from here).
; If you prefer the Arduino IDE, install the same libraries by name and copy
; these files into a sketch; lv_conf.h must sit where LVGL can find it.

[env:grind-bw]
; The AMOLED panel driver (Arduino_GFX) needs Arduino-ESP32 core 3.x — it
; includes esp32-hal-periman.h, which only exists in core 3.0+. The default
; `espressif32` platform still ships core 2.0.x, so use the community
; pioarduino platform, which tracks core 3.x.
; >>> If this exact tag 404s, copy the newest one from:
;     https://github.com/pioarduino/platform-espressif32/releases
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- ESP32-S3 with 16 MB flash + 8 MB OPI PSRAM (typical for this board).
;     Adjust memory_type if your unit uses QSPI PSRAM instead of OPI.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE          ; LVGL #includes "lv_conf.h"
    -I include                         ; make include/lv_conf.h visible to the LVGL *library* too,
                                       ; not just src/ — without this, enabled fonts never compile
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D CORE_DEBUG_LEVEL=0              ; FT3168 NACKs when no touch -> Wire logs Error -1 every poll;
                                      ; silence core logs (your Serial.print output is unaffected)

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3
    lvgl/lvgl @ ^8.3.11
    moononournation/GFX Library for Arduino @ ^1.4.9