<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#ffffff"/>
  <text x="390" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">GRIND-BW — wiring</text>
  <text x="390" y="60" text-anchor="middle" font-size="13" fill="#666">Waveshare ESP32-S3-Touch-AMOLED-1.64  →  grinder 4-pin harness</text>

  <!-- ESP32 module -->
  <rect x="70" y="110" width="215" height="225" rx="14" fill="#eef3fb" stroke="#2f6f3e" stroke-width="2"/>
  <text x="177" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#22402a">ESP32-S3</text>
  <text x="177" y="156" text-anchor="middle" font-size="11" fill="#567">Touch-AMOLED-1.64</text>

  <!-- ESP32 pads (right edge) -->
  <rect x="267" y="183" width="18" height="16" fill="#d23b34"/>
  <text x="259" y="195" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a1a">5V</text>

  <rect x="267" y="233" width="18" height="16" fill="#e0992a"/>
  <text x="259" y="245" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a1a">GPIO 18</text>

  <rect x="267" y="283" width="18" height="16" fill="#222"/>
  <text x="259" y="295" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a1a">GND</text>

  <!-- Grinder module -->
  <rect x="500" y="95" width="210" height="285" rx="14" fill="#fbf0ee" stroke="#b5462f" stroke-width="2"/>
  <text x="605" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#5a2418">Grinder harness</text>

  <!-- Grinder pins (left edge) -->
  <rect x="500" y="151" width="18" height="16" fill="#d23b34"/>
  <text x="526" y="163" font-size="13" fill="#1a1a1a">Pin 1 · 5V power</text>

  <rect x="500" y="201" width="18" height="16" fill="#bbb"/>
  <text x="526" y="213" font-size="13" fill="#999">Pin 2 · Button (not used)</text>

  <rect x="500" y="251" width="18" height="16" fill="#e0992a"/>
  <text x="526" y="263" font-size="13" fill="#1a1a1a">Pin 3 · Motor control</text>

  <rect x="500" y="301" width="18" height="16" fill="#222"/>
  <text x="526" y="313" font-size="13" fill="#1a1a1a">Pin 4 · Ground</text>

  <!-- Wires -->
  <line x1="285" y1="191" x2="500" y2="159" stroke="#d23b34" stroke-width="4"/>
  <line x1="285" y1="241" x2="500" y2="259" stroke="#e0992a" stroke-width="4"/>
  <line x1="285" y1="291" x2="500" y2="309" stroke="#222" stroke-width="4"/>

  <text x="392" y="232" text-anchor="middle" font-size="11" fill="#a06a10">motor control · active-high (~3.3 V)</text>

  <!-- Notes -->
  <rect x="70" y="372" width="640" height="74" rx="10" fill="#f7f7f9" stroke="#ddd" stroke-width="1"/>
  <text x="86" y="396" font-size="12.5" fill="#333">• GPIO 18 is active-high: the grinder motor runs while this pin is driven HIGH (~3.3 V).</text>
  <text x="86" y="416" font-size="12.5" fill="#333">• Firmware drives GPIO 18 LOW at boot, so a reset never leaves the burrs spinning.</text>
  <text x="86" y="436" font-size="12.5" fill="#333">• Pin 2 (button) is left unconnected. Confirm GPIO 18 is free on your board revision.</text>
</svg>
